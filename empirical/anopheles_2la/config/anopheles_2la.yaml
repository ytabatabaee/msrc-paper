    right_flank:
      start: 42165533
      end: null
      status: "candidate"
      rationale: "Bounded by the proximal 2La breakpoint; no Stage-0 scientific flank length is frozen."
    candidate_window_bp:
      - 250000
      - 500000
      - 1000000
